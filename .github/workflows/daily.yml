name: Daily README Update

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run tracker
        run: python tracker.py

      - name: Commit and push
        run: |
          git config user.name "tahabinzafar"
          git config user.email "tahazafar96@gmail.com"
          git add README.md
          git diff --staged --quiet || git commit -m "daily update: $(date '+%Y-%m-%d')"
          git push
